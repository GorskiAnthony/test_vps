version: "3.8"

services:
  web:
    image: ${DOCKER_IMAGE}
    container_name: ${PROJECT_NAME:-project}-web
    restart: always
    env_file:
      - ../envs/.env-${GITHUB_REPOSITORY_NAME}
    environment:
      APP_PORT: 3000
      APP_SECRET: ${APP_SECRET:-123456789}
      DB_HOST: ${DATABASE_SUBDOMAIN_NAME}-db
      DB_PORT: 3306
      DB_USER: ${USER_NAME}
      DB_PASSWORD: ${USER_PASSWORD}
      DB_NAME: ${DB_NAME}
      VITE_API_URL: ""
      PROJECT_NAME_SPECIFIC_SAMPLE: ${PROJECT_NAME_SPECIFIC_SAMPLE}
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.${PROJECT_NAME:-project}.entrypoints=websecure"
      - "traefik.http.routers.${PROJECT_NAME:-project}.rule=Host(`${PROJECT_NAME:-project}.${HOST:-localhost}`)"
      - "traefik.http.routers.${PROJECT_NAME:-project}.tls.certresolver=myresolver"
      - "traefik.http.services.${PROJECT_NAME:-project}.loadbalancer.server.port=3000"

networks:
  proxy:
    external: true
