name: CD-traefik

on:
  push:
    branches:
      - staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v3

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🛠️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ vars.PROJECT_NAME }}:latest

      - name: 🚀 Deploy on VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e

            echo "📥 Pull de l'image"
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ vars.PROJECT_NAME }}:latest

            echo "🧹 Suppression du container précédent (s'il existe)"
            docker stop ${{ vars.PROJECT_NAME }}-web || true
            docker rm ${{ vars.PROJECT_NAME }}-web || true

            echo "🌐 Vérification du réseau traefik"
            docker network ls | grep -q proxy || docker network create proxy

            echo "🔐 Chargement des variables globales"
            GLOBAL_ENV_PATH=/home/ubuntu/traefik/data/.env
            HOST=$(grep '^HOST=' $GLOBAL_ENV_PATH | cut -d '=' -f2)
            APP_SECRET=$(grep '^APP_SECRET=' $GLOBAL_ENV_PATH | cut -d '=' -f2)
            DB_HOST="$(grep '^DATABASE_SUBDOMAIN_NAME=' $GLOBAL_ENV_PATH | cut -d '=' -f2)-db"
            DB_USER=$(grep '^USER_NAME=' $GLOBAL_ENV_PATH | cut -d '=' -f2)
            DB_PASSWORD=$(grep '^USER_PASSWORD=' $GLOBAL_ENV_PATH | cut -d '=' -f2)

            echo "🧾 Génération du .env projet"
            ENV_PROJECT_PATH=/tmp/${{ vars.PROJECT_NAME }}.env

            echo "APP_PORT=3310" > $ENV_PROJECT_PATH
            echo "APP_SECRET=$APP_SECRET" >> $ENV_PROJECT_PATH
            echo "DB_HOST=$DB_HOST" >> $ENV_PROJECT_PATH
            echo "DB_PORT=3306" >> $ENV_PROJECT_PATH
            echo "DB_USER=$DB_USER" >> $ENV_PROJECT_PATH
            echo "DB_PASSWORD=$DB_PASSWORD" >> $ENV_PROJECT_PATH
            echo "DB_NAME=${{ vars.PROJECT_NAME }}" >> $ENV_PROJECT_PATH
            echo "HOST=$HOST" >> $ENV_PROJECT_PATH
            echo "DOCKER_IMAGE=${{ secrets.DOCKER_USERNAME }}/${{ vars.PROJECT_NAME }}:latest" >> $ENV_PROJECT_PATH
            echo "PROJECT_NAME=${{ vars.PROJECT_NAME }}" >> $ENV_PROJECT_PATH

            echo "✅ .env généré avec succès :"
            grep -E '^(APP_PORT|DB_HOST|DB_NAME|HOST)=' $ENV_PROJECT_PATH

            echo "📂 Déploiement du projet avec Docker Compose"
            cd /home/ubuntu/projects/${{ vars.PROJECT_DIRECTORY_NAME }}

            # ✅ Créer un .env vide pour bloquer l'import implicite
            touch .env

            COMPOSE_FILE=docker-compose.prod.yml \
            COMPOSE_PROJECT_NAME=${{ vars.PROJECT_NAME }} \
            docker compose --env-file $ENV_PROJECT_PATH up -d --remove-orphans

            echo "⏳ Attente du démarrage du container..."
            sleep 10

            echo "🚀 Lancement de la migration (npm run migrate)"
            docker exec ${{ vars.PROJECT_NAME }}-web npm run migrate || echo "❗ Migration échouée ou non nécessaire"
