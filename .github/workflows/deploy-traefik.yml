name: CD-traefik

on:
  push:
    branches:
      - staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v3

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🛠️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/project-${{ vars.PROJECT_NAME }}:latest

      - name: 🚀 Deploy on VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            export GITHUB_ACCOUNT_NAME=${{ github.repository_owner }}
            export GITHUB_REPOSITORY_NAME=${{ vars.PROJECT_NAME }}
            export PROJECT_NAME=${{ vars.PROJECT_NAME }}
            export GITHUB_JSON_VARS=$(jq -n               --arg DOCKER_USERNAME "${{ secrets.DOCKER_USERNAME }}"               --arg DATABASE_SUBDOMAIN_NAME "${{ vars.DATABASE_SUBDOMAIN_NAME }}"               --arg USER_NAME "${{ vars.USER_NAME }}"               --arg USER_PASSWORD "${{ secrets.USER_PASSWORD }}"               --arg APP_SECRET "${{ secrets.APP_SECRET }}"               '{
                "DOCKER_USERNAME": $DOCKER_USERNAME,
                "DATABASE_SUBDOMAIN_NAME": $DATABASE_SUBDOMAIN_NAME,
                "USER_NAME": $USER_NAME,
                "USER_PASSWORD": $USER_PASSWORD,
                "APP_SECRET": $APP_SECRET
              }')

            bash /home/ubuntu/traefik/deploy/js-project.sh "$GITHUB_ACCOUNT_NAME" "$GITHUB_REPOSITORY_NAME" "$PROJECT_NAME" "$GITHUB_JSON_VARS"
