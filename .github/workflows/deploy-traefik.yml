name: CD-traefik

on:
  push:
    branches:
      - staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v3

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🛠️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ vars.PROJECT_NAME }}:latest

      - name: 🚀 Deploy on VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ vars.PROJECT_NAME }}:latest

            docker stop ${{ vars.PROJECT_NAME }} || true
            docker rm ${{ vars.PROJECT_NAME }} || true

            docker network ls | grep -q proxy || docker network create proxy

            GLOBAL_ENV_PATH=/home/ubuntu/traefik/data/.env
            HOST=$(grep '^HOST=' $GLOBAL_ENV_PATH | cut -d '=' -f2)
            APP_SECRET=$(grep '^APP_SECRET=' $GLOBAL_ENV_PATH | cut -d '=' -f2)
            DB_HOST="$(grep '^DATABASE_SUBDOMAIN_NAME=' $GLOBAL_ENV_PATH | cut -d '=' -f2)-db"
            DB_USER=$(grep '^USER_NAME=' $GLOBAL_ENV_PATH | cut -d '=' -f2)
            DB_PASSWORD=$(grep '^USER_PASSWORD=' $GLOBAL_ENV_PATH | cut -d '=' -f2)

            ENV_PROJECT_PATH=/tmp/${{ vars.PROJECT_NAME }}.env

            echo "APP_PORT=3310" > $ENV_PROJECT_PATH
            echo "DB_HOST=$DB_HOST" >> $ENV_PROJECT_PATH
            echo "DB_NAME=${{ vars.PROJECT_NAME }}" >> $ENV_PROJECT_PATH
            echo "HOST=$HOST" >> $ENV_PROJECT_PATH

            echo "✅ .env projet généré :"
            cat $ENV_PROJECT_PATH

            docker run -d \
              --name ${{ vars.PROJECT_NAME }} \
              --env-file $ENV_PROJECT_PATH \
              --network proxy \
              -l traefik.enable=true \
              -l traefik.docker.network=proxy \
              -l "traefik.http.routers.${{ vars.PROJECT_NAME }}.rule=Host(\`${{ vars.PROJECT_NAME }}.${HOST}\`)" \
              -l "traefik.http.routers.${{ vars.PROJECT_NAME }}.entrypoints=websecure" \
              -l "traefik.http.routers.${{ vars.PROJECT_NAME }}.tls.certresolver=myresolver" \
              -l "traefik.http.services.${{ vars.PROJECT_NAME }}.loadbalancer.server.port=3310" \
              -p 3310:3310 \
              ${{ secrets.DOCKER_USERNAME }}/${{ vars.PROJECT_NAME }}:latest

            echo "⏳ Attente du démarrage du container..."
            sleep 10

            echo "🚀 Lancement de la migration..."
            docker exec ${{ vars.PROJECT_NAME }} npm run migrate || echo "❗ Migration échouée ou non nécessaire"
